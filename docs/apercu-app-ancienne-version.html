.app{min-height:100vh;padding:12px 14px 96px}

.brand{text-align:center;font-weight:800;font-size:18px;margin:6px 0 2px;color:var(--blue2)}
.sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 12px}
h1{font-size:22px;margin:8px 0 6px}
.muted{color:var(--muted);font-size:13px;line-height:1.4}
.card{background:#fff;border-radius:16px;padding:14px;margin:10px 0;border:1px solid var(--line)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;font-size:15px;font-weight:700;margin:8px 0}
.primary{background:linear-gradient(180deg,#1E88E5,#1565C0);color:#fff}
.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.soft{background:#E3F2FD;color:var(--blue2)}
input,select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:15px;margin:6px 0;background:#fff}
label{font-size:12px;color:var(--muted);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 12px;font-size:13px}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.scores{display:flex;gap:8px}
.score{flex:1;border-radius:14px;padding:10px;border:1.5px solid}
.score b{display:block;font-size:18px}
.score span{font-size:11px;color:var(--muted)}
.ok{background:var(--greenBg);border-color:#B7E3C9;color:var(--green)}
.warn{background:var(--orangeBg);border-color:#E6D39A;color:var(--orange)}
.bad{background:var(--redBg);border-color:#F0B7B7;color:var(--red)}
.item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0}
.tabs{display:flex;gap:12px;border-bottom:1px solid var(--line);overflow:auto}
.tabs a{padding:10px 2px;color:var(--muted);font-weight:700;text-decoration:none;white-space:nowrap}
.tabs a.on{color:var(--blue);border-bottom:3px solid var(--blue)}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px 14px}
.nav button{border:0;background:0;font-size:10px;color:#6a7780}
.nav button.on{color:var(--blue);font-weight:800}
.ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;margin:0 auto 3px;color:#fff;font-size:13px}
.back{border:0;background:#E3F2FD;border-radius:10px;padding:7px 10px;font-weight:700}
.banner{background:#FFF6D8;border:1px solid #E6D39A;color:#7A5B10;border-radius:12px;padding:10px;font-size:13px;margin:8px 0}
.alert{background:var(--redBg);border:1px solid #F0B7B7;color:var(--red);border-radius:12px;padding:10px;font-size:13px}
.okb{background:var(--greenBg);border:1px solid #B7E3C9;color:var(--green);border-radius:12px;padding:10px;font-size:13px}
.disclaimer{font-size:11px;color:#7A8790;margin-top:10px}
.row{display:flex;gap:8px}.row>div{flex:1}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.status{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}
.onair{background:var(--greenBg);color:var(--green)}
.offair{background:#eee;color:#666}
.err{background:var(--redBg);color:var(--red)}
.bar{height:8px;background:#eef2f4;border-radius:99px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--blue)}

</head>

function villeObj(nom){
  var n=fold(nom);
  for(var i=0;i<VILLES.length;i++){if(fold(VILLES[i].nom).indexOf(n)>=0) return VILLES[i];}
  return null;

function hav(a,b){var R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLon=(b.lon-a.lon)*Math.PI/180;var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function cls(n){return n>=75?"ok":n>=55?"warn":"bad";}
function lecture(n){return n>=75?"lecture favorable":n>=55?"lecture prudente":"vigilance";}
function avg(arr){var x=[],i;for(i=0;i<arr.length;i++) if(arr[i]!=null) x.push(arr[i]); return x.length?x.reduce(function(a,b){return a+b;},0)/x.length:5;}
function scoreOf(p,origin){
  var dist=null;
  if(origin&&p.lat) dist=hav(origin,p);
  else if(fold(p.ville)===fold(S.ville)) dist=2;
  var prox=dist==null?5:Math.max(0,10*(1-dist/S.rayon));
  var years=p.annee?Math.min(10,(new Date().getFullYear()-p.annee)/3):5;
  var F=avg([p.noteDip,p.noteCert,p.noteConf]);
  var A=avg([p.noteAvis,p.noteReco]);
  var w=S.poids,sum=w.F+w.A+w.P+w.E||1;
  var fiab=Math.round(10*((w.F/sum)*F+(w.A/sum)*A+(w.P/sum)*prox+(w.E/sum)*years));
  var fit=(!S.spec)?0.7:(p.specialiteId===S.spec?0.9:((p.fitTags||[]).indexOf(S.spec)>=0?0.75:0.35));
  return {fiab:fiab,fit:Math.round(fit*10),besoin:Math.round(0.6*fiab+0.4*fit*10),dist:dist==null?null:Math.round(dist),prox:Math.round(prox*10),completude:p.completude};
}

function quiz1(){
  return '<button class="back" onclick="go(\'home\',\'home\')">Retour</button><p class="muted">Étape 1 / 3</p><h1>Où se situe le problème ?</h1>'+
    QZONES.map(function(z){return '<button class="btn '+(S.q.zone===z.id?"primary":"ghost")+'" onclick="S.q.zone=\''+z.id+'\';go(\'quiz2\')">'+z.l+'</button>';}).join("");
}
function quiz2(){
  var list=QTYPES[S.q.zone]||[];
  return '<button class="back" onclick="go(\'quiz1\')">Retour</button><p class="muted">Étape 2 / 3</p><h1>Quel est le problème exact ?</h1>'+
    list.map(function(t){return '<button class="btn '+(S.q.type===t.id?"primary":"ghost")+'" onclick="S.q.type=\''+t.id+'\';go(\'quiz3\')">'+t.l+'</button>';}).join("");
}
function quiz3(){
  var durs=[["48h","Moins de 48 heures"],["jours","Quelques jours"],["sem","Plus de 2 semaines"]];
  var al=[["fievre","Fièvre"],["douleur","Douleur violente"],["etend","Rougeur qui s’étend"],["aucun","Aucun de ces signes"]];
  return '<button class="back" onclick="go(\'quiz2\')">Retour</button><p class="muted">Étape 3 / 3</p><h1>Durée et signes d’alerte</h1>'+
    '<label>Durée</label><select onchange="S.q.duree=this.value">'+durs.map(function(d){return '<option value="'+d[0]+'" '+(S.q.duree===d[0]?"selected":"")+'>'+d[1]+'</option>';}).join("")+'</select>'+
    '<div class="chips">'+al.map(function(a){return '<button class="chip '+(S.q.alertes.indexOf(a[0])>=0?"on":"")+'" onclick="toggleAl(\''+a[0]+'\')">'+a[1]+'</button>';}).join("")+'</div>'+
    '<button class="btn primary" onclick="orient()">Voir les spécialités</button>';
}
window.toggleAl=function(id){
  if(id==="aucun"){ S.q.alertes=["aucun"]; render(); return; }
  var next=[], seen=false;
  for(var i=0;i<S.q.alertes.length;i++){
    if(S.q.alertes[i]==="aucun") continue;
    if(S.q.alertes[i]===id){ seen=true; continue; }
    next.push(S.q.alertes[i]);
  }
  if(!seen) next.push(id);
  S.q.alertes=next;
  render();
};
function orient(){
  var raw=ORIENT[S.q.type]||[{id:"med_gen",p:1,ph:"Un médecin généraliste peut faire le premier point."}];
  S.suggestions=raw.slice().sort(function(a,b){return b.p-a.p;}).slice(0,3);
  S.spec=S.suggestions[0].id;
  go("orient");
}
function orientView(){
  var urgent=S.q.alertes.some(function(a){return a!=="aucun";});
  return '<button class="back" onclick="go(\'quiz3\')">Retour</button><h1>Spécialistes suggérés</h1>'+
    (urgent?'<div class="alert">Signe d’alerte coché. Si fièvre, douleur forte ou rougeur qui s’étend : 15 ou urgences.</div>':'')+
    S.suggestions.map(function(s){return '<div class="item"><h3>'+SPECIALITES[s.id]+'</h3><p class="muted">'+s.ph+'</p><button class="btn primary" onclick="S.spec=\''+s.id+'\';go(\'searchform\',\'search\')">Rechercher</button></div>';}).join("")+
    '<button class="btn ghost" onclick="go(\'searchform\',\'search\')">Autre spécialité</button>';
}
function slider(k,l){return '<label>'+l+' · '+S.poids[k]+'%</label><input type="range" min="0" max="50" value="'+S.poids[k]+'" oninput="S.poids.'+k+'=+this.value;render()"/>';}
function searchForm(){
  var opts=""; for(var k in SPECIALITES) opts+='<option value="'+k+'" '+(S.spec===k?"selected":"")+'>'+SPECIALITES[k]+'</option>';
  return '<h1>Recherche</h1><label>Spécialité</label><select onchange="S.spec=this.value">'+opts+'</select>'+
    '<label>Ville</label><input value="'+esc(S.ville||S.profil.ville||"")+'" oninput="S.ville=this.value"/>'+
    '<label>Rayon</label><select onchange="S.rayon=+this.value">'+[5,10,25,50,100].map(function(r){return '<option '+(S.rayon===r?"selected":"")+' value="'+r+'">'+r+' km</option>';}).join("")+'</select>'+
    '<div class="card"><b>Ce qui compte pour vous</b>'+slider("F","Fiabilité")+slider("A","Avis")+slider("P","Proximité")+slider("E","Ancienneté")+'</div>'+
    '<button class="btn primary" onclick="runSearch()">Rechercher</button>';
}
function runSearch(){
  if(!S.spec) S.spec="chir_gen";
  if(!S.ville){alert("Indiquez une ville.");return;}
  var origin=villeObj(S.ville);
  var list=[];
  for(var i=0;i<CATALOG.length;i++){
    var p=CATALOG[i];
    var same=p.specialiteId===S.spec || (p.fitTags||[]).indexOf(S.spec)>=0;
    var sc=scoreOf(p,origin);
    var inR=sc.dist==null ? fold(p.ville).indexOf(fold(S.ville))>=0 : sc.dist<=S.rayon;
    if(same && inR){p.sc=sc;list.push(p);}
  }
  list.sort(function(a,b){return b.sc.besoin-a.sc.besoin;});
  S.results=list;
  S.lastSearch={spec:S.spec,ville:S.ville,rayon:S.rayon,n:list.length,at:Date.now()};
  S.history.unshift({type:"RECHERCHE",label:SPECIALITES[S.spec]+" · "+S.ville+" · "+S.rayon+" km",spec:S.spec,ville:S.ville,rayon:S.rayon,n:list.length,at:Date.now()});
  persist(); go("results","search");
}
function cardMini(p){
  var s=p.sc;
  return '<div class="item" onclick="openFiche(\''+p.id+'\')"><div class="row"><h3 style="margin:0">'+p.titre+' '+p.prenom+' '+p.nom+'</h3><span class="muted">'+(s.dist!=null?s.dist+" km":p.ville)+'</span></div><div class="muted">'+(p.sous||SPECIALITES[p.specialiteId])+' · '+p.ville+'</div><div class="scores" style="margin-top:8px"><div class="score '+cls(s.besoin)+'"><b>'+s.besoin+'/100</b><span>Pertinence</span></div><div class="score '+cls(s.fiab)+'"><b>'+s.fiab+'/100</b><span>Fiabilité</span></div><div class="score '+cls(s.completude)+'"><b>'+s.completude+'%</b><span>Données</span></div></div></div>';
}
function resultsView(){
  if(!S.results.length) return '<button class="back" onclick="go(\'searchform\')">Modifier</button><div class="card"><h2>Aucun résultat</h2><p>Élargissez le rayon ou changez de ville.</p></div>';
  return '<button class="back" onclick="go(\'searchform\')">Modifier</button><h1>'+esc(S.ville)+' · '+S.rayon+' km</h1><p class="muted">'+S.results.length+' spécialistes · '+SPECIALITES[S.spec]+'</p>'+S.results.map(cardMini).join("")+'<p class="disclaimer">Score selon vos poids. Pas un classement officiel.</p>';
}
window.openFiche=function(id){
  for(var i=0;i<CATALOG.length;i++) if(CATALOG[i].id===id) S.current=CATALOG[i];
  S.current.sc=scoreOf(S.current,villeObj(S.ville||S.current.ville));
  S.detailTab="synthese";
  S.history.unshift({type:"FICHE",label:S.current.titre+" "+S.current.prenom+" "+S.current.nom,id:id,at:Date.now()});
  persist(); go("fiche",S.tab);
};
function fiche(){
  var p=S.current,s=p.sc;
  var tabs=[["synthese","Synthèse"],["fiab","Fiabilité"],["acces","Accès"],["info","Informations"]];
  var body="";
  if(S.detailTab==="synthese"){
    body='<div class="scores"><div class="score '+cls(s.besoin)+'"><b>'+s.besoin+'/100</b><span>Pertinence · '+lecture(s.besoin)+'</span></div><div class="score '+cls(s.fiab)+'"><b>'+s.fiab+'/100</b><span>Fiabilité</span></div><div class="score '+cls(s.completude)+'"><b>'+s.completude+'/100</b><span>Confiance données</span></div></div>'+
      '<div class="row"><div class="card"><b>Points favorables</b>'+(p.certifications[0]?'<p>✓ '+p.certifications[0]+'</p>':'')+'<p>✓ Identité documentée</p>'+(p.carteVitale?'<p>✓ Carte Vitale</p>':'')+'</div><div class="card"><b>Vigilance</b>'+(p.specialiteId!==S.spec?'<p>⚠ Sur-spécialité différente</p>':'')+(p.secteur==="2"?'<p>⚠ Secteur 2</p>':'')+(!p.certifications.length?'<p>⚠ HAS non listée</p>':'')+'</div></div>';
  } else if(S.detailTab==="fiab"){
    var rows=[["Diplômes",p.noteDip],["HAS / certif.",p.noteCert],["Avis",p.noteAvis],["Rôle",p.noteReco],["Travaux",p.noteConf]];
    body=rows.map(function(r){return '<div class="card"><div class="row"><b>'+r[0]+'</b><span>'+r[1]+'/10</span></div><div class="bar"><i style="width:'+(r[1]*10)+'%"></i></div></div>';}).join("");
  } else if(S.detailTab==="acces"){
    body='<div class="card"><p>Secteur '+p.secteur+(p.optam?" · OPTAM":"")+'</p><p>'+(p.carteVitale?"Carte Vitale oui":"Carte Vitale non renseignée")+'</p><p>Mode : '+p.mode+'</p><p>Tél. : '+(p.tel||"Non renseigné")+'</p></div>';
  } else {
    body='<div class="card"><p>RPPS '+p.rpps+'</p><p>'+(p.diplomes.join(" · ")||"Non renseigné")+'</p><p>'+p.ville+" "+(p.cp||"")+'</p></div>';
  }
  return '<button class="back" onclick="go(S.results.length?\'results\':\'home\')">Retour</button><h1>'+p.titre+" "+p.prenom+" "+p.nom+'</h1><p class="muted">'+p.sous+" · "+p.ville+'</p>'+
    '<div class="tabs">'+tabs.map(function(t){return '<a class="'+(S.detailTab===t[0]?"on":"")+'" href="#" onclick="S.detailTab=\''+t[0]+'\';render();return false">'+t[1]+'</a>';}).join("")+'</div>'+body+
    '<div class="actions"><button class="btn ghost" onclick="callTel(\''+(p.tel||"")+'\')">Appeler</button><button class="btn ghost" onclick="itineraire(\''+p.ville+" "+(p.cp||"")+'\')">Itinéraire</button><button class="btn ghost" onclick="pin(\''+p.id+'\')">'+(S.pins.indexOf(p.id)>=0?"Désépingler":"Épingler")+'</button><button class="btn primary" onclick="shareFiche()">Partager</button></div>'+
    '<p class="disclaimer">Pas un diagnostic. Urgence : 15.</p>';
}
function synth(){
  if(!S.lastSearch) return '<div class="card"><h2>Pas encore de synthèse</h2><button class="btn primary" onclick="openTab(\'home\')">Accueil</button></div>';
  var pins=S.pins.map(function(id){for(var i=0;i<CATALOG.length;i++) if(CATALOG[i].id===id) return CATALOG[i];}).filter(Boolean);
  pins.forEach(function(p){p.sc=scoreOf(p,villeObj(S.ville||p.ville));});
  return '<h1>Synthèse</h1><div class="card"><b>Dernière recherche</b><p>'+SPECIALITES[S.lastSearch.spec]+" · "+S.lastSearch.ville+" · "+S.lastSearch.rayon+" km</p></div>"+(S.results||[]).slice(0,3).map(cardMini).join("")+"<h2>Épinglés</h2>"+(pins.length?pins.map(cardMini).join(""):"<p class='muted'>Épinglez 2 fiches pour comparer.</p>");
}
function hist(){
  if(!S.history.length) return '<div class="card"><h2>Historique vide</h2></div>';
  return '<div class="row"><h1>Historique</h1><button class="back" onclick="S.history=[];persist();render()">Effacer</button></div>'+S.history.map(function(h,i){return '<div class="item" onclick="replay('+i+')"><b>'+(h.type==="FICHE"?"👤 ":"🔎 ")+esc(h.label)+'</b><div class="muted">'+new Date(h.at).toLocaleString("fr-FR")+'</div></div>';}).join("");
}
window.replay=function(i){var h=S.history[i]; if(h.type==="FICHE") openFiche(h.id); else {S.spec=h.spec;S.ville=h.ville;S.rayon=h.rayon;runSearch();}};
function profil(){
  return headerLogo(true)+'<h1>Profil</h1><label>Prénom</label><input value="'+esc(S.profil.prenom)+'" oninput="S.profil.prenom=this.value;persist()"/>'+
    '<label>Ville favorite</label><input value="'+esc(S.profil.ville)+'" oninput="S.profil.ville=this.value;persist()"/>'+
    '<button class="btn soft" onclick="go(\'apis\',\'profil\')">Sources & API</button>'+
    '<div class="card"><b>Pondérations</b>'+slider("F","Fiabilité")+slider("A","Avis")+slider("P","Proximité")+slider("E","Ancienneté")+'</div>'+
    '<p class="muted">Données uniquement sur cet appareil.</p>';
}

function httpGet(url, header){
  return new Promise(function(resolve){
    try{
      if(window.Android && Android.httpGet){
        var raw=Android.httpGet(url, header||"");
        resolve(JSON.parse(raw));
        return;
      }
    }catch(e){}
    var ctrl=typeof AbortController!=="undefined"?new AbortController():null;
    var t=setTimeout(function(){if(ctrl) ctrl.abort();},8000);
    fetch(url,{signal:ctrl?ctrl.signal:undefined,headers:{"Accept":"*/*"}}).then(function(r){
      return r.text().then(function(t2){clearTimeout(t);resolve({ok:r.ok,status:r.status,body:t2.slice(0,4000)});});
    }).catch(function(err){clearTimeout(t);resolve({ok:false,status:0,error:String(err)});});
  });
}

function apisView(){
  var cfg=loadApi();
  var html=headerLogo(true)+'<button class="back" onclick="go(\'profil\',\'profil\')">Retour</button><h1>Sources & API</h1>'+
    '<p class="muted">Activez une source, collez une clé si besoin, puis testez. Le catalogue local reste le filet de sécurité.</p>'+
    '<div class="card"><label>Clé FHIR Annuaire Santé (optionnelle)</label><input id="fhirKey" value="'+esc(cfg.fhirKey||"")+'" placeholder="ESANTE-API-KEY" oninput="var c=loadApi();c.fhirKey=this.value;saveApi(c)"/></div>';
  for(var i=0;i<APIDEF.length;i++){
    var a=APIDEF[i];
    var on=cfg[a.id]!==false;
    var test=S.apiTests[a.id];
    var badge=test?(test.ok?'<span class="status onair">OK '+test.status+'</span>':'<span class="status err">Échec</span>'):'<span class="status offair">Non testé</span>';
    html+='<div class="card"><div class="row"><b>'+a.name+'</b>'+badge+'</div><p class="muted">'+a.desc+'</p>'+
      '<label><input type="checkbox" '+(on?"checked":"")+' onchange="toggleSrc(\''+a.id+'\',this.checked)"/> Utiliser cette source</label>'+
      '<button class="btn ghost" onclick="testApi(\''+a.id+'\')">Tester la connexion</button>'+
      (test?'<p class="muted">'+(test.error||("HTTP "+test.status+" — "+(test.preview||"")))+'</p>':'')+
      '</div>';
  }
  html+='<button class="btn primary" onclick="testAll()">Tout tester</button>';
  return html;
}
window.toggleSrc=function(id,on){var c=loadApi();c[id]=on;saveApi(c);};
window.testApi=function(id){
  var a=null; for(var i=0;i<APIDEF.length;i++) if(APIDEF[i].id===id) a=APIDEF[i];
  S.apiTests[id]={ok:false,status:0,preview:"test…"};
  render();
  if(id==="local"){S.apiTests[id]={ok:true,status:200,preview:CATALOG.length+" fiches locales"};render();return;}
  var cfg=loadApi();
  var header="";
  if(id==="fhir" && cfg.fhirKey) header="ESANTE-API-KEY:"+cfg.fhirKey;
  httpGet(a.url, header).then(function(res){
    S.apiTests[id]={ok:!!res.ok,status:res.status||0,preview:(res.body||res.error||"").toString().slice(0,160),error:res.error};
    render();
  });
};
window.testAll=function(){for(var i=0;i<APIDEF.length;i++) testApi(APIDEF[i].id);};

window.pin=function(id){if(S.pins.indexOf(id)>=0) S.pins=S.pins.filter(function(x){return x!==id;}); else {if(S.pins.length>=2) S.pins.shift(); S.pins.push(id);} persist();render();};
window.shareFiche=function(){
  var p=S.current,s=p.sc;
  var t=p.titre+" "+p.nom+" — "+SPECIALITES[p.specialiteId]+" — "+p.ville+" — score "+s.besoin+"/100 selon Recherche spécialiste. Ceci n’est pas un avis médical.";
  if(window.Android&&Android.share) Android.share(t); else if(navigator.share) navigator.share({text:t}); else alert(t);
};
window.callTel=function(tel){if(!tel){alert("Numéro non renseigné");return;} if(window.Android&&Android.call) Android.call(tel); else location.href="tel:"+tel;};
window.itineraire=function(q){if(window.Android&&Android.maps) Android.maps(q); else window.open("https://maps.google.com/?q="+encodeURIComponent(q));};

function render(){
  try{
    var map={home:home,quiz1:quiz1,quiz2:quiz2,quiz3:quiz3,orient:orientView,searchform:searchForm,results:resultsView,fiche:fiche,synth:synth,hist:hist,profil:profil,apis:apisView};
    var fn=map[S.screen]||home;
    document.getElementById("app").innerHTML=fn();
    document.getElementById("nav").innerHTML=nav();
  }catch(e){
    document.getElementById("app").innerHTML=headerLogo(false)+'<div class="alert">Erreur d’affichage : '+esc(e.message)+'</div><button class="btn primary" onclick="S.screen=\'home\';render()">Réouvrir l’accueil</button>';
  }
}
window.go=go; window.openTab=openTab; window.orient=orient; window.runSearch=runSearch; window.render=render;
render();
})();
</script>
</body>
</html>
